<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" role="img" aria-label="A cat watching a cup of coffee" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .tail{transform-box:fill-box;transform-origin:100% 100%;animation:sway 2.6s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(9deg)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    .head{transform-box:fill-box;transform-origin:50% 100%;animation:tilt 5s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
    .steam{opacity:0;animation:rise 2.8s ease-in-out infinite}
    .s2{animation-delay:.9s}.s3{animation-delay:1.8s}
    @keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
    .heart{opacity:0;animation:float 4s ease-in infinite;animation-delay:1s}
    @keyframes float{0%{transform:translateY(8px);opacity:0}20%{opacity:.9}100%{transform:translateY(-22px);opacity:0}}
  </style>

  <!-- floor -->
  <line x1="30" y1="226" x2="410" y2="226" stroke="#a78bfa" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round"/>

  <!-- tail -->
  <g class="tail" fill="none" stroke-linecap="round">
    <path d="M84 205 C32 210 24 160 48 138" stroke="#7c3aed" stroke-width="18"/>
    <path d="M84 205 C32 210 24 160 48 138" stroke="#ddd6fe" stroke-width="12"/>
  </g>

  <!-- body -->
  <ellipse cx="140" cy="182" rx="62" ry="44" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
  <ellipse cx="118" cy="219" rx="15" ry="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
  <ellipse cx="162" cy="219" rx="15" ry="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>

  <!-- head -->
  <g class="head">
    <path d="M96 80 L101 34 L132 64 Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
    <path d="M184 80 L179 34 L148 64 Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
    <path d="M105 68 L107 47 L122 62 Z" fill="#f0abfc"/>
    <path d="M175 68 L173 47 L158 62 Z" fill="#f0abfc"/>
    <ellipse cx="140" cy="106" rx="52" ry="45" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="111" cy="122" r="8" fill="#f0abfc" opacity=".55"/>
    <circle cx="169" cy="122" r="8" fill="#f0abfc" opacity=".55"/>
    <ellipse class="eye" cx="122" cy="104" rx="5" ry="8" fill="#4c1d95"/>
    <ellipse class="eye" cx="158" cy="104" rx="5" ry="8" fill="#4c1d95"/>
    <circle cx="124" cy="100" r="1.8" fill="#fff"/>
    <circle cx="160" cy="100" r="1.8" fill="#fff"/>
    <path d="M135 117 L145 117 L140 123 Z" fill="#f0abfc" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M140 123 Q134 131 128 127 M140 123 Q146 131 152 127" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" opacity=".8">
      <line x1="96" y1="116" x2="72" y2="111"/><line x1="96" y1="123" x2="72" y2="126"/>
      <line x1="184" y1="116" x2="208" y2="111"/><line x1="184" y1="123" x2="208" y2="126"/>
    </g>
  </g>

  <!-- coffee mug -->
  <path d="M344 190 q20 0 20 16 q0 16 -20 16" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <rect x="296" y="178" width="48" height="46" rx="9" fill="#f0abfc" stroke="#7c3aed" stroke-width="3"/>
  <ellipse cx="320" cy="178" rx="24" ry="6" fill="#6b3a2a" stroke="#7c3aed" stroke-width="3"/>
  <path d="M310 198 q10 8 20 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>

  <!-- steam -->
  <g fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
    <path class="steam" d="M308 166 q-7 -10 0 -19 q7 -9 0 -18"/>
    <path class="steam s2" d="M320 166 q-7 -10 0 -19 q7 -9 0 -18"/>
    <path class="steam s3" d="M332 166 q-7 -10 0 -19 q7 -9 0 -18"/>
  </g>

  <!-- floating heart -->
  <path class="heart" d="M214 96 c-6 -8 -16 0 -8 8 l8 8 l8 -8 c8 -8 -2 -16 -8 -8z" fill="#f0abfc"/>

  <text x="220" y="251" text-anchor="middle" font-family="'Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#a78bfa">but first, coffee ✦</text>
</svg>
