<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-label="A cozy night corner with a cat, a cup of coffee, a plant and fairy lights" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1740"/><stop offset="1" stop-color="#312c70"/></linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".35"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="878" height="308" rx="14"/></clipPath>
  </defs>
  <style>
    .bulb{animation:glow 3s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
    .star{animation:glow 3.6s ease-in-out infinite}
    .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite}
    @keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.85,1.15)}}
    .leaf{transform-box:fill-box;transform-origin:50% 100%;animation:sway2 4s ease-in-out infinite}
    @keyframes sway2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="310" fill="url(#night)"/>
    <circle cx="440" cy="190" r="240" fill="url(#warm)"/>

    <!-- window -->
    <g>
      <rect x="62" y="64" width="130" height="150" rx="8" fill="#14103a" stroke="#8b7fe0" stroke-width="4"/>
      <path d="M127 64 V214 M62 139 H192" stroke="#8b7fe0" stroke-width="3"/>
      <circle cx="98" cy="102" r="15" fill="#ede9fe"/><circle cx="106" cy="97" r="13" fill="#14103a"/>
      <g fill="#f5f3ff">
        <circle class="star" cx="150" cy="92" r="1.8"/><circle class="star" style="animation-delay:1s" cx="170" cy="118" r="1.5"/>
        <circle class="star" style="animation-delay:2s" cx="88" cy="172" r="1.6"/><circle class="star" style="animation-delay:.5s" cx="160" cy="190" r="1.4"/>
      </g>
      <rect x="54" y="214" width="146" height="10" rx="4" fill="#4c3fa8" stroke="#8b7fe0" stroke-width="2"/>
    </g>

    <!-- rug -->
    <ellipse cx="440" cy="256" rx="300" ry="22" fill="#3b3580" stroke="#6d5fc7" stroke-width="2"/>
    <ellipse cx="440" cy="256" rx="250" ry="16" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/>

    <!-- cat with coffee -->
    <g transform="translate(245 22)">
      <style>
    .tail{transform-box:fill-box;transform-origin:100% 100%;animation:sway 2.6s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(9deg)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    .head{transform-box:fill-box;transform-origin:50% 100%;animation:tilt 5s ease-in-out infinite}
    @keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
    .steam{opacity:0;animation:rise 2.8s ease-in-out infinite}
    .s2{animation-delay:.9s}.s3{animation-delay:1.8s}
    @keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
    .heart{opacity:0;animation:float 4s ease-in infinite;animation-delay:1s}
    @keyframes float{0%{transform:translateY(8px);opacity:0}20%{opacity:.9}100%{transform:translateY(-22px);opacity:0}}
  </style>

  

  <g class="tail" fill="none" stroke-linecap="round">
    <path d="M84 205 C32 210 24 160 48 138" stroke="#7c3aed" stroke-width="18"/>
    <path d="M84 205 C32 210 24 160 48 138" stroke="#ddd6fe" stroke-width="12"/>
  </g>

  <ellipse cx="140" cy="182" rx="62" ry="44" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
  <ellipse cx="118" cy="219" rx="15" ry="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
  <ellipse cx="162" cy="219" rx="15" ry="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>

  <g class="head">
    <path d="M96 80 L101 34 L132 64 Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
    <path d="M184 80 L179 34 L148 64 Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
    <path d="M105 68 L107 47 L122 62 Z" fill="#f0abfc"/>
    <path d="M175 68 L173 47 L158 62 Z" fill="#f0abfc"/>
    <ellipse cx="140" cy="106" rx="52" ry="45" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="111" cy="122" r="8" fill="#f0abfc" opacity=".55"/>
    <circle cx="169" cy="122" r="8" fill="#f0abfc" opacity=".55"/>
    <ellipse class="eye" cx="122" cy="104" rx="5" ry="8" fill="#4c1d95"/>
    <ellipse class="eye" cx="158" cy="104" rx="5" ry="8" fill="#4c1d95"/>
    <circle cx="124" cy="100" r="1.8" fill="#fff"/>
    <circle cx="160" cy="100" r="1.8" fill="#fff"/>
    <path d="M135 117 L145 117 L140 123 Z" fill="#f0abfc" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M140 123 Q134 131 128 127 M140 123 Q146 131 152 127" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" opacity=".8">
      <line x1="96" y1="116" x2="72" y2="111"/><line x1="96" y1="123" x2="72" y2="126"/>
      <line x1="184" y1="116" x2="208" y2="111"/><line x1="184" y1="123" x2="208" y2="126"/>
    </g>
  </g>

  <path d="M344 190 q20 0 20 16 q0 16 -20 16" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <rect x="296" y="178" width="48" height="46" rx="9" fill="#f0abfc" stroke="#7c3aed" stroke-width="3"/>
  <ellipse cx="320" cy="178" rx="24" ry="6" fill="#6b3a2a" stroke="#7c3aed" stroke-width="3"/>
  <path d="M310 198 q10 8 20 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>

  <g fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
    <path class="steam" d="M308 166 q-7 -10 0 -19 q7 -9 0 -18"/>
    <path class="steam s2" d="M320 166 q-7 -10 0 -19 q7 -9 0 -18"/>
    <path class="steam s3" d="M332 166 q-7 -10 0 -19 q7 -9 0 -18"/>
  </g>

  <path class="heart" d="M214 96 c-6 -8 -16 0 -8 8 l8 8 l8 -8 c8 -8 -2 -16 -8 -8z" fill="#f0abfc"/>

  
    </g>

    <!-- books + candle -->
    <g stroke="#4c3fa8" stroke-width="2">
      <rect x="690" y="226" width="86" height="14" rx="3" fill="#a78bfa"/>
      <rect x="696" y="212" width="74" height="14" rx="3" fill="#f0abfc"/>
      <rect x="702" y="198" width="62" height="14" rx="3" fill="#c4b5fd"/>
    </g>
    <rect x="726" y="170" width="14" height="28" rx="3" fill="#fef3c7" stroke="#4c3fa8" stroke-width="2"/>
    <ellipse cx="733" cy="150" rx="22" ry="22" fill="url(#warm)"/>
    <path class="flame" d="M733 150 q-6 8 0 14 q6 -6 0 -14z" fill="#fde68a"/>

    <!-- plant -->
    <g>
      <g class="leaf" fill="#6ee7b7" stroke="#2f7a63" stroke-width="2" stroke-linejoin="round">
        <path d="M812 196 Q786 160 800 128 Q824 150 812 196Z"/>
        <path d="M812 196 Q842 168 838 132 Q810 152 812 196Z"/>
        <path d="M812 196 Q812 152 826 112 Q838 156 812 196Z" fill="#86efac"/>
      </g>
      <path d="M792 194 H832 L826 240 H798 Z" fill="#a78bfa" stroke="#4c3fa8" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="788" y="188" width="48" height="10" rx="4" fill="#c4b5fd" stroke="#4c3fa8" stroke-width="2.5"/>
    </g>

    <!-- fairy lights -->
    <path d="M0 22 Q75 52 150 22" fill="none" stroke="#6d5fc7" stroke-width="2"/><path d="M150 22 Q225 52 300 22" fill="none" stroke="#6d5fc7" stroke-width="2"/><path d="M300 22 Q375 52 450 22" fill="none" stroke="#6d5fc7" stroke-width="2"/><path d="M450 22 Q525 52 600 22" fill="none" stroke="#6d5fc7" stroke-width="2"/><path d="M600 22 Q675 52 750 22" fill="none" stroke="#6d5fc7" stroke-width="2"/><path d="M750 22 Q825 52 900 22" fill="none" stroke="#6d5fc7" stroke-width="2"/>
    <g class="bulb" style="animation-delay:0.00s"><circle cx="38" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="38" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:0.37s"><circle cx="75" cy="44" r="9" fill="#f0abfc" opacity=".25"/><circle cx="75" cy="42" r="4.5" fill="#f0abfc"/></g><g class="bulb" style="animation-delay:0.74s"><circle cx="112" cy="40.25" r="9" fill="#a5f3fc" opacity=".25"/><circle cx="112" cy="38.25" r="4.5" fill="#a5f3fc"/></g><g class="bulb" style="animation-delay:1.11s"><circle cx="188" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="188" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:1.48s"><circle cx="225" cy="44" r="9" fill="#fbcfe8" opacity=".25"/><circle cx="225" cy="42" r="4.5" fill="#fbcfe8"/></g><g class="bulb" style="animation-delay:1.85s"><circle cx="262" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="262" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:2.22s"><circle cx="338" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="338" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:2.59s"><circle cx="375" cy="44" r="9" fill="#f0abfc" opacity=".25"/><circle cx="375" cy="42" r="4.5" fill="#f0abfc"/></g><g class="bulb" style="animation-delay:2.96s"><circle cx="412" cy="40.25" r="9" fill="#a5f3fc" opacity=".25"/><circle cx="412" cy="38.25" r="4.5" fill="#a5f3fc"/></g><g class="bulb" style="animation-delay:0.33s"><circle cx="488" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="488" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:0.70s"><circle cx="525" cy="44" r="9" fill="#fbcfe8" opacity=".25"/><circle cx="525" cy="42" r="4.5" fill="#fbcfe8"/></g><g class="bulb" style="animation-delay:1.07s"><circle cx="562" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="562" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:1.44s"><circle cx="638" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="638" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:1.81s"><circle cx="675" cy="44" r="9" fill="#f0abfc" opacity=".25"/><circle cx="675" cy="42" r="4.5" fill="#f0abfc"/></g><g class="bulb" style="animation-delay:2.18s"><circle cx="712" cy="40.25" r="9" fill="#a5f3fc" opacity=".25"/><circle cx="712" cy="38.25" r="4.5" fill="#a5f3fc"/></g><g class="bulb" style="animation-delay:2.55s"><circle cx="788" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="788" cy="38.25" r="4.5" fill="#fde68a"/></g><g class="bulb" style="animation-delay:2.92s"><circle cx="825" cy="44" r="9" fill="#fbcfe8" opacity=".25"/><circle cx="825" cy="42" r="4.5" fill="#fbcfe8"/></g><g class="bulb" style="animation-delay:0.29s"><circle cx="862" cy="40.25" r="9" fill="#fde68a" opacity=".25"/><circle cx="862" cy="38.25" r="4.5" fill="#fde68a"/></g>
  </g>

  <text x="440" y="296" text-anchor="middle" font-family="'Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#c4b5fd">but first, coffee ✦</text>
  <rect x="1" y="1" width="878" height="308" rx="14" fill="none" stroke="#4c3fa8" stroke-width="2"/>
</svg>
